<!doctype html>
<html lang="fr">

  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>ENSTA Sign</title>
    <!-- Police : Open Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <!-- Lien avec le CSS -->
    <link href="styles/style.css" rel="stylesheet">
    <script src="./scripts/login.js"></script>
  </head>

  <body>
    <main>
        <div class="wrap_login">
            <div class="header_login">
                <img src="images/logo_ensta_paris.jpg" alt="Logo ENSTA Paris" height="200vh" width="auto" />
                <h1>Entrez vos identifiants</h1>
            </div>
            <!-- formulaire de connexion -->
            <!-- TODO : Validation UI-->
            <form action="javascript:loginFront()" method="post">
                <div class="form_login">
                    <input type="text" id="email" name="email" placeholder="Adresse email" required="required"/>
                </div>
                <div class="form_login">
                    <input type="password" is="pwd" name="pwd" placeholder="Mot de passe" required="required"/>
                </div>
                <div class="form_login">
                    <input type="submit" value="Se connecter" />
                </div>

            </form>
        </div>
    </main>

    <footer>
        <p>This webpage was created for a class project. It is not suitable for online release</p>
        <p>DO WHATEVER YOU WANT TO PUBLIC LICENSE Version 2, December 2004</p>
    </footer>
  </body>

</html>
